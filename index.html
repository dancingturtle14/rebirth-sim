<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>輪迴局：異世界投胎模擬</title><meta name="description" content="隨機投胎到歷史上某個時代，用估算嘅歷史人口數據過一世。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='%231a1626'/><rect x='2' y='1' width='4' height='3' fill='%23f1c9a0'/><rect x='1' y='4' width='6' height='3' fill='%23ffcc4d'/></svg>">
<link rel="preload" href="fonts/Cubic_11.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css"></head><body><main>
<section id="s-start" class="scr on">
 <h1>輪迴局</h1><p class="sub">異世界投胎模擬器 · 像素版</p>
 <div class="panel"><canvas class="scene" id="cv-title"></canvas></div>
 <div class="panel"><p>孟婆湯已經飲咗。下一世，你會喺邊個時代、邊個地方、咩出身？</p>
 <div class="setup"><label>投胎方式<select id="o-era"><option value="">隨機（按當時人口加權）</option></select></label>
 <label>預設速度<select id="o-speed"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option><option value="16">16x</option></select></label>
 <label><input type="checkbox" id="o-auto"> 抉擇自動倒數代揀</label></div>
 <button class="btn" id="b-go">▶ 投胎</button>
 <div class="row"><button class="btn alt sm" id="b-past">前世紀錄 <span id="n-past">0</span></button><button class="btn alt sm" onclick="location.href='about.html'">資料來源</button></div></div>
 <div class="panel"><h2>時代圖鑑</h2><div class="chips" id="chips"></div></div>
 <div class="panel" id="past" style="display:none"><h2>前世</h2><div id="past-list"></div></div>
 <p class="note">內容涉及戰爭、疾病、死亡，建議 15 歲以上。所有數字為歷史估算，唔代表真實個人命運。</p>
</section>
<section id="s-birth" class="scr">
 <div class="panel"><h2 id="draw-h">抽籤中……</h2><div id="draw" class="draw"></div></div>
 <div id="reg" style="display:none"><div class="panel"><canvas class="scene" id="cv-birth"></canvas></div><div class="panel reg" id="reg-card"></div>
 <button class="btn" id="b-live">開始呢一世 ▶</button></div>
</section>
<section id="s-life" class="scr">
 <div class="hud"><div class="panel tight"><div class="age"><span><span class="big" id="h-age">0</span> 歲</span><span id="h-year" class="dim"></span></div>
 <div id="h-who" class="dim small"></div></div></div>
 <div class="panel"><canvas class="scene" id="cv-life"></canvas><div id="stats" style="margin-top:8px"></div></div>
 <div class="panel"><h2>今年重點</h2><div class="focus" id="focus"></div></div>
 <div class="panel"><h2>錢包</h2><div id="money"></div></div>
 <div class="panel"><h2>人生格</h2><div class="grid" id="l-grid"></div><p class="note">每格一年，越亮越快樂；框線＝當時平均壽命</p></div>
 <div class="panel"><h2>人生紀錄</h2><div class="feed" id="feed"></div></div>
</section>
<section id="s-final" class="scr">
 <div class="panel center"><p class="dim">最後一年</p><p class="huge" id="f-age"></p><canvas class="scene" id="cv-final"></canvas><p id="f-cause" style="margin-top:8px"></p></div>
 <div class="panel"><h2>一生回顧</h2><canvas class="scene" id="cv-replay"></canvas><p id="replay-t" class="replay"></p></div>
 <button class="btn" id="b-record">睇死亡紀錄 ▶</button>
</section>
<section id="s-end" class="scr">
 <div class="panel"><canvas class="scene" id="cv-end"></canvas><h2 style="margin-top:8px" id="e-title"></h2><div id="e-sum"></div></div>
 <div class="panel"><h2>同一刻出生嘅靈魂（按壽命排）</h2><div id="e-souls"></div></div>
 <div class="panel"><h2>存活曲線</h2><canvas id="cv-surv" class="chart"></canvas><p class="note" id="surv-note"></p></div>
 <div class="panel"><h2>財富變化</h2><canvas id="cv-money" class="chart"></canvas></div>
 <div class="panel"><h2>一生年譜</h2><div class="grid" id="e-grid"></div><p class="note">■紅=歷史大事 ■藍=抉擇 ■白=離世；亮度=快樂；框線=平均壽命</p></div>
 <div class="panel"><h2>重要時刻</h2><div id="e-log"></div></div>
 <div class="panel"><h2>分享卡</h2><img class="share" id="e-card" alt="結果卡"><button class="btn" id="b-dl">下載 PNG</button></div>
 <button class="btn" id="b-again">↻ 再輪迴</button><button class="btn alt" onclick="location.href='./'">返主頁</button>
</section>
</main>
<div class="ctrl" id="ctrl" style="display:none"><button data-s="0">⏸</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="4">4x</button><button data-s="8">8x</button><button data-s="16">16x</button><button id="c-skip" title="跳到下一個抉擇">⏭</button><button id="c-auto" title="自動代揀">🤖</button></div>
<div class="modal" id="modal"><div class="panel"><small id="m-age" class="dim"></small><h2 id="m-t"></h2><div class="statbox" id="m-stat"></div><div id="m-c"></div><p class="note" id="m-cd"></p></div></div>
<script src="data/eras.js"></script><script src="data/stats.js"></script><script src="data/era-extra.js"></script><script src="data/events.js"></script><script src="data/calib.js"></script><script src="js/scene.js"></script><script src="js/engine.js"></script><script src="js/ui.js"></script>
</body></html>
